[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h743-stereo-viewer"
version = "0.1.0"
description = "Standalone read-only H743 IMU2 and stereo camera recorder"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "pyserial>=3.5,<4",
    "PySide6>=6.7,<7",
    "psutil>=5.9,<8",
    "pyqtgraph>=0.13.7,<0.15",
]

[project.scripts]
h743-viewer = "imu_viewer.__main__:main"

[tool.setuptools.packages.find]
include = ["imu_viewer*"]
